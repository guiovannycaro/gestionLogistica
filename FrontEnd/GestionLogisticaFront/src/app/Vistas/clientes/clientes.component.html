<app-navbar></app-navbar>
<app-sidebar></app-sidebar>
<div class="content-wrapper">
    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1>Clientes</h1>
                    </div>
                    <div class="col-sm-6">
                        <ol class="breadcrumb float-sm-right">
                            <li class="breadcrumb-item"><a href="home">Home</a></li>
                            <li class="breadcrumb-item active">Dashboard</li>
                        </ol>
                    </div>
                </div>
            </div>
            <!-- /.container-fluid -->
        </section>

        <!-- Main content -->
        <section class="content">

            <!-- Default box -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title"></h3>

                    <div class="card-tools">
                        <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
            <i class="fas fa-minus"></i>
          </button>
                        <button type="button" class="btn btn-tool" data-card-widget="remove" title="Remove">
            <i class="fas fa-times"></i>
          </button>
                    </div>
                </div>
                <div class="card-body">

                    <button mat-raised-button color="primary" type="submit" class="btn btn-info" (click)="openAddClieForm()"> Nuevo Cliente</button>

                    <table class="table table-bordered">
                        <tr>
                            <th>ID</th>
                            <th>Nombres</th>
                            <th>Tipo Documento</th>
                            <th>Cedula</th>
                            <th>Correo</th>
                            <th>Celular</th>
                            <th>Direccion</th>
                            <th>Ciudad</th>
                            <th>Estado</th>
                            <th width="220px">Accion</th>
                        </tr>

                        <tr *ngFor="let i of clientes">
                            <td>{{i.cli_ID }}</td>
                            <td>{{i.cli_NOMBRES}}</td>
                            <td>{{i.cli_TIPODOCUMENTO}}</td>
                            <td>{{i.cli_CEDULA}}</td>
                            <td>{{i.cli_CORREO}}</td>
                            <td>{{i.cli_CELULAR}}</td>
                            <td>{{i.cli_DIRECCION}}</td>
                            <td>{{i.cli_CIUDAD_ID}}</td>
                            <td>{{i.cli_ESTADO}}</td>
                            <td>

                                <button type="button" class="btn btn-danger" (click)="openEditCliForm(i.cli_ID)">Editar</button>
                                <button type="button" class="btn btn-danger" (click)="eliminarCliente(i.cli_ID)">Eliminar</button>
                            </td>
                        </tr>

                    </table>




                </div>
                <!-- /.card-body -->
                <div class="card-footer">

                </div>
                <!-- /.card-footer-->
            </div>
            <!-- /.card -->

        </section>
    </div>

</div>
<app-footer></app-footer>
